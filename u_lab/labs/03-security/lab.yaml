id: "03-security"
title: "Permissions & Security Hardening"
difficulty: "Hard"
estimated_time: "20m"
description: "Configure advanced ACLs on folders, lock down command executions using sudoers configuration, and harden SSH access."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  ports:
    - "8022:22"
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
