id: "10-apparmor"
title: "AppArmor Security Profiles"
difficulty: "Hard"
estimated_time: "25m"
description: "Lock down public-facing daemons (Nginx) using AppArmor security profiles, confining their filesystem and network access limits."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
    - "/sys/kernel/security:/sys/kernel/security:rw"
  cap_add:
    - "SYS_ADMIN"
    - "MAC_ADMIN"
