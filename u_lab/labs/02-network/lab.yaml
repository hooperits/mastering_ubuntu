id: "02-network"
title: "Network & Firewall Engineering"
difficulty: "Medium"
estimated_time: "25m"
description: "Configure static IP network profiles using Netplan, secure server ingress rules using UFW, and setup local hostname DNS aliases."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  ports:
    - "8081:80"
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
    - "NET_ADMIN"
