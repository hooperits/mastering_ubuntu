id: "09-pam"
title: "PAM Security & User Hardening"
difficulty: "Hard"
estimated_time: "20m"
description: "Configure system auth limits using Pluggable Authentication Modules (PAM) to lock out brute-force attacks and enforce complex passwords."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
