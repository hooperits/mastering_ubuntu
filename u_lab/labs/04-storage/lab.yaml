id: "04-storage"
title: "Storage & LVM Partitioning"
difficulty: "Medium"
estimated_time: "20m"
description: "Simulate logical volume configurations, configure persistent disk mounts in fstab, and set up system swap swapfiles."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
