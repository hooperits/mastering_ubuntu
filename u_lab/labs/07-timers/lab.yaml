id: "07-timers"
title: "System Automation & Timers"
difficulty: "Medium"
estimated_time: "20m"
description: "Configure automated scheduled tasks using modern systemd timers instead of cron, backing up directories systematically."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
