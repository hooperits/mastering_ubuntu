id: "08-diagnostics"
title: "System Diagnostics & Performance"
difficulty: "Medium"
estimated_time: "20m"
description: "Diagnose system resource exhaustion, identify CPU/Memory leaking processes, and resolve file system inode exhaustion."
container:
  image: "u-lab-base:latest"
  hostname: "ubuntu-server"
  privileged: true
  volumes:
    - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
  cap_add:
    - "SYS_ADMIN"
